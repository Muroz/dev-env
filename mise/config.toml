# Global tool versions, managed by mise.
#
# Symlinked to ~/.config/mise/config.toml by ./bootstrap/install.sh. These
# versions are used exactly as committed — the installer does not rewrite this
# file, so the checkout stays clean and the `git pull` in update-tools.sh
# keeps working.
#
# Changing a version here and running `mise install` on each laptop is how the
# machines stay on the same toolchain. Renovate watches this file and opens a
# pull request when a tool has a newer release; see renovate.json.

[tools]
node = "22"
bun = "1.4"

# ============================================================================
# What is deliberately not here
# ============================================================================
# python    conda provides it (/opt/anaconda3), and pyenv was set to `system`
#           and managing nothing before it was removed. Handing Python to mise
#           would put a second interpreter ahead of conda's on PATH, and both
#           tools rewrite PATH when they activate. Not worth the breakage for
#           a machine whose Python work runs through conda.
#
# rust      rustup manages its own toolchains and updates them in place.
#
# ============================================================================
# Upgrade targets
# ============================================================================
# Node 26 is the current LTS line; 22 is in maintenance. Moving is a
# deliberate edit here followed by `mise install` on both laptops, or just
# merging the Renovate pull request.
#
# ============================================================================
# Per-project overrides
# ============================================================================
# A .mise.toml in any project overrides these, and mise switches versions as
# you cd between directories. mise also reads .nvmrc and .python-version, so
# existing projects need no change.
#
#   [tools]
#   node = "20.11.0"
