# Global tool versions, managed by mise.
#
# Symlinked to ~/.config/mise/config.toml by `./bootstrap/install.sh --use-mise`.
# These versions are used exactly as committed — the installer does not rewrite
# this file, so the repo stays clean and `git pull` in update-tools.sh keeps
# working.
#
# Changing a version here and running `mise install` on each laptop is how the
# two machines stay on the same toolchain.

[tools]
# Node.js. 22 is the line both machines are on today (maintenance LTS).
node = "22"

# Python. pyenv had no global version set, so this pins what was in use.
python = "3.12"

# Bun. 1.0.0 was installed and is three years stale; 1.4 is the current line.
bun = "1.4"

# ============================================================================
# Upgrade targets
# ============================================================================
# Current upstream as of 2026-11. Moving to these is a deliberate choice, not
# something an install should do behind your back — edit the values above when
# you want them, then run `mise install` on both laptops.
#
#   node   = "26"     Node 26 is the active LTS line; 22 is in maintenance
#   python = "3.14"   3.14 is the current stable series
#
# Rust stays with rustup and conda stays with conda in both modes, so neither
# is listed here.

# ============================================================================
# Per-project overrides
# ============================================================================
# A .mise.toml in any project overrides these, and mise switches versions as
# you cd between directories. mise also reads .nvmrc and .python-version, so
# existing projects need no change.
#
#   [tools]
#   node = "20.11.0"
#   python = "3.11"
