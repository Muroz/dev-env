name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # macOS, because the scripts are macOS-only: they assume Homebrew,
    # /Applications and `brew list --cask`.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Run checks
        # --fast skips the installer dry runs. They need a configured
        # Homebrew and would report a runner's packages, not this repo's
        # correctness, so they stay a local check.
        run: ./scripts/check.sh --fast

      - name: Confirm the dry runs change nothing
        # The invariant worth guarding here is that a dry run does not touch
        # the checkout. Its exit status is not: a bare runner has no VS Code,
        # no oh-my-zsh and no version managers, so the run warns about
        # optional tools, and that is correct behaviour rather than a fault
        # in the repo. The status is reported, not asserted.
        run: |
          set +e
          ./bootstrap/install.sh --dry-run > /dev/null 2>&1
          echo "standard dry run exited $?"
          ./bootstrap/install.sh --dry-run --use-mise > /dev/null 2>&1
          echo "mise dry run exited $?"
          set -e

          if [ -n "$(git status --porcelain)" ]; then
            echo "A dry run modified the checkout:"
            git status --porcelain
            exit 1
          fi
          echo "Checkout unchanged."
